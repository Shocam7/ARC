<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARC — Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #040508;
      --surface: rgba(10,13,20,0.85);
      --surface2: rgba(17,22,34,0.9);
      --cyan: #00e5ff;
      --cyan-dim: rgba(0,229,255,0.15);
      --text: #e8eaf0;
      --text-muted: #6b7280;
      --border: rgba(0,229,255,0.15);
      --red: #ff4d6d;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ── WORLD BACKGROUND ── */
    #world-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    #world-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.45) saturate(1.4) blur(1px);
      transition: opacity 1.2s ease;
      opacity: 0;
    }
    #world-video.active { opacity: 1; }
    #world-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4,5,8,0.5) 0%, rgba(4,5,8,0.2) 50%, rgba(4,5,8,0.6) 100%);
    }
    #no-world-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 60%, rgba(0,40,60,0.6) 0%, var(--bg) 70%);
    }

    /* ── LAYOUT ── */
    .room-layout {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: rgba(4,5,8,0.6);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-logo {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .room-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
    }
    .room-code-display {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--cyan);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .room-code-display:hover { opacity: 0.8; }
    .copy-hint { font-size: 0.62rem; color: var(--text-muted); }
    .participant-count {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* ── VIDEO GRID ── */
    .video-grid {
      flex: 1;
      display: grid;
      gap: 12px;
      padding: 1rem;
      align-content: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-tile {
      position: relative;
      background: rgba(10,13,20,0.7);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      transition: border-color 0.3s;
    }
    .video-tile.speaking {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0,229,255,0.2);
    }
    .video-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tile-label {
      position: absolute;
      bottom: 0.6rem;
      left: 0.6rem;
      background: rgba(4,5,8,0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      font-size: 0.72rem;
      color: var(--text);
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .mic-icon { font-size: 0.65rem; }
    .mic-icon.muted { color: var(--red); }
    .tile-you { color: var(--cyan); font-size: 0.62rem; margin-left: 0.2rem; }

    /* ── CONTROLS BAR ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: rgba(4,5,8,0.7);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
    }
    .ctrl-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
    }
    .ctrl-btn:hover { border-color: rgba(0,229,255,0.4); background: var(--cyan-dim); }
    .ctrl-btn.active { background: var(--cyan-dim); border-color: var(--cyan); }
    .ctrl-btn.danger {
      background: var(--red);
      border-color: var(--red);
      width: 60px;
      height: 60px;
      font-size: 1.3rem;
      color: #fff;
    }
    .ctrl-btn.danger:hover { background: #ff2244; box-shadow: 0 0 20px rgba(255,77,109,0.4); }
    .ctrl-btn.muted-btn { border-color: var(--red); color: var(--red); }

    /* ── WORLD BADGE ── */
    .world-badge {
      position: fixed;
      top: 5rem;
      right: 1.5rem;
      background: rgba(10,13,20,0.85);
      border: 1px solid var(--cyan);
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      font-size: 0.72rem;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      z-index: 10;
      display: none;
    }
    .world-badge.show { display: flex; }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.6rem 1.25rem;
      font-size: 0.8rem;
      color: var(--text);
      backdrop-filter: blur(12px);
      z-index: 999;
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── WAITING STATE ── */
    .waiting {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: var(--text-muted);
      padding: 3rem;
      text-align: center;
    }
    .waiting .big { font-size: 2.5rem; }
    .waiting .label { font-size: 0.85rem; line-height: 1.6; }
    .waiting .code-big {
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      color: var(--cyan);
      letter-spacing: 0.2em;
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.25rem;
    }

    /* ── CONNECTING STATE ── */
    .connecting-spinner {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- WORLD BACKGROUND -->
<div id="world-bg">
  <video id="world-video" autoplay playsinline muted></video>
  <div id="world-overlay"></div>
  <div id="no-world-bg"></div>
</div>

<div class="room-layout">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">ARC</div>
    <div class="room-info">
      <div class="room-code-display" onclick="copyRoomCode()" title="Click to copy">
        <span id="display-code">---</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </div>
      <div class="copy-hint">click to copy code</div>
    </div>
    <div class="participant-count" id="participant-count">1 participant</div>
  </div>

  <!-- VIDEO GRID -->
  <div class="video-grid" id="video-grid">
    <!-- Populated by JS -->
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="ctrl-btn" id="mic-btn" onclick="toggleMic()" title="Toggle mic">🎤</button>
    <button class="ctrl-btn" id="cam-btn" onclick="toggleCam()" title="Toggle camera">📷</button>
    <button class="ctrl-btn danger" onclick="leaveRoom()" title="Leave">📵</button>
    <button class="ctrl-btn" onclick="copyRoomCode()" title="Share room code">🔗</button>
  </div>
</div>

<!-- WORLD BADGE -->
<div class="world-badge" id="world-badge">
  <div class="live-dot"></div>
  World Live
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const roomId = params.get('room')?.toUpperCase();
const myName = params.get('name') || 'Guest';

if (!roomId) location.href = '/';

document.getElementById('display-code').textContent = roomId;

const STUN_SERVERS = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' }
  ]
};

const socket = io();
let localStream = null;
let peers = {};       // peerId -> RTCPeerConnection
let peerInfo = {};    // peerId -> { name, role }
let micOn = true;
let camOn = true;
let myId = null;
let worldPeerId = null;

// ── GET LOCAL MEDIA ──
async function getMedia() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      camOn = false;
      document.getElementById('cam-btn').textContent = '🚫';
      showToast('Camera not available — audio only');
    } catch {
      localStream = new MediaStream();
      micOn = false; camOn = false;
      showToast('No media access — view-only mode');
    }
  }
  renderLocalTile();
}

// ── RENDER LOCAL TILE ──
function renderLocalTile() {
  const grid = document.getElementById('video-grid');
  let tile = document.getElementById('local-tile');

  if (!tile) {
    tile = document.createElement('div');
    tile.id = 'local-tile';
    tile.className = 'video-tile';
    tile.innerHTML = `
      <video id="local-video" autoplay muted playsinline></video>
      <div class="tile-label">
        <span class="mic-icon" id="local-mic-icon">🎤</span>
        <span>${myName}</span>
        <span class="tile-you">(you)</span>
      </div>`;
    grid.appendChild(tile);
  }

  const vid = document.getElementById('local-video');
  if (localStream) vid.srcObject = localStream;
  updateGrid();
}

// ── ADD REMOTE TILE ──
function addRemoteTile(peerId, name) {
  const grid = document.getElementById('video-grid');
  if (document.getElementById(`tile-${peerId}`)) return;

  const tile = document.createElement('div');
  tile.id = `tile-${peerId}`;
  tile.className = 'video-tile';
  tile.innerHTML = `
    <video id="vid-${peerId}" autoplay playsinline></video>
    <div class="tile-label">
      <span class="mic-icon" id="mic-${peerId}">🎤</span>
      <span>${name}</span>
    </div>`;
  grid.appendChild(tile);
  updateGrid();
}

function removeTile(peerId) {
  document.getElementById(`tile-${peerId}`)?.remove();
  updateGrid();
}

function updateGrid() {
  const grid = document.getElementById('video-grid');
  const n = grid.children.length;
  if (n === 0) return;
  const cols = n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4;
  const tileW = Math.min(380, (window.innerWidth - 32 - (cols-1)*12) / cols);
  const tileH = Math.round(tileW * 0.5625); // 16:9
  grid.style.gridTemplateColumns = `repeat(${cols}, ${tileW}px)`;
  grid.style.gridTemplateRows = `auto`;
  grid.querySelectorAll('.video-tile').forEach(t => {
    t.style.width = tileW + 'px';
    t.style.height = tileH + 'px';
  });

  const count = Object.keys(peers).length + 1;
  document.getElementById('participant-count').textContent =
    `${count} participant${count !== 1 ? 's' : ''}`;
}

// ── WEBRTC PEER ──
function createPeer(peerId, isInitiator) {
  if (peers[peerId]) return peers[peerId];

  const pc = new RTCPeerConnection(STUN_SERVERS);
  peers[peerId] = pc;

  if (localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }

  pc.ontrack = (e) => {
    const info = peerInfo[peerId];
    if (info?.role === 'world') {
      // Render as world background
      const worldVid = document.getElementById('world-video');
      worldVid.srcObject = e.streams[0];
      worldVid.classList.add('active');
      document.getElementById('no-world-bg').style.display = 'none';
      document.getElementById('world-badge').classList.add('show');
      worldPeerId = peerId;
    } else {
      const vid = document.getElementById(`vid-${peerId}`);
      if (vid) vid.srcObject = e.streams[0];
    }
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      socket.emit('signal', {
        to: peerId,
        signal: { type: 'candidate', candidate: e.candidate }
      });
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      pc.close();
      delete peers[peerId];
    }
  };

  if (isInitiator) {
    pc.createOffer()
      .then(offer => pc.setLocalDescription(offer))
      .then(() => {
        socket.emit('signal', {
          to: peerId,
          signal: { type: 'offer', sdp: pc.localDescription }
        });
      });
  }

  return pc;
}

async function handleSignal(from, signal) {
  if (!peers[from]) createPeer(from, false);
  const pc = peers[from];

  if (signal.type === 'offer') {
    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('signal', {
      to: from,
      signal: { type: 'answer', sdp: pc.localDescription }
    });
  } else if (signal.type === 'answer') {
    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
  } else if (signal.type === 'candidate') {
    try { await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)); } catch {}
  }
}

// ── SOCKET EVENTS ──
socket.on('room-joined', ({ roomId: rid, userId, users }) => {
  myId = userId;
  // Initiate peer connection with all existing users
  users.forEach(u => {
    peerInfo[u.id] = u;
    if (u.role !== 'world') {
      addRemoteTile(u.id, u.name);
    }
    createPeer(u.id, true);
  });
});

socket.on('user-joined', ({ userId, name, role }) => {
  peerInfo[userId] = { id: userId, name, role };
  if (role !== 'world') {
    addRemoteTile(userId, name);
    showToast(`${name} joined`);
  } else {
    showToast(`🌍 A world is now being shared`);
  }
  createPeer(userId, false);
});

socket.on('user-left', ({ userId, role }) => {
  const info = peerInfo[userId];
  if (info?.role === 'world' || role === 'world') {
    const worldVid = document.getElementById('world-video');
    worldVid.srcObject = null;
    worldVid.classList.remove('active');
    document.getElementById('no-world-bg').style.display = 'block';
    document.getElementById('world-badge').classList.remove('show');
    worldPeerId = null;
    showToast('World stream ended');
  } else {
    removeTile(userId);
    showToast(`${info?.name || 'Someone'} left`);
  }
  peers[userId]?.close();
  delete peers[userId];
  delete peerInfo[userId];
  updateGrid();
});

socket.on('signal', ({ from, signal }) => handleSignal(from, signal));
socket.on('error', ({ message }) => showToast('⚠️ ' + message));

// ── CONTROLS ──
function toggleMic() {
  micOn = !micOn;
  localStream?.getAudioTracks().forEach(t => t.enabled = micOn);
  const btn = document.getElementById('mic-btn');
  btn.textContent = micOn ? '🎤' : '🔇';
  btn.classList.toggle('muted-btn', !micOn);
}

function toggleCam() {
  camOn = !camOn;
  localStream?.getVideoTracks().forEach(t => t.enabled = camOn);
  const btn = document.getElementById('cam-btn');
  btn.textContent = camOn ? '📷' : '🚫';
  btn.classList.toggle('muted-btn', !camOn);
}

function leaveRoom() {
  localStream?.getTracks().forEach(t => t.stop());
  Object.values(peers).forEach(pc => pc.close());
  socket.disconnect();
  window.location.href = '/';
}

function copyRoomCode() {
  navigator.clipboard.writeText(roomId).then(() => showToast('Room code copied! ' + roomId));
}

// ── TOAST ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── INIT ──
window.addEventListener('resize', updateGrid);

(async () => {
  await getMedia();
  socket.emit('join-room', { roomId, name: myName, role: 'guest' });
})();
</script>
</body>
</html>
