<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARC — Share a World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #040508;
      --surface: rgba(10,13,20,0.9);
      --cyan: #00e5ff;
      --cyan-dim: rgba(0,229,255,0.1);
      --text: #e8eaf0;
      --text-muted: #6b7280;
      --border: rgba(0,229,255,0.15);
      --red: #ff4d6d;
    }

    html, body {
      height: 100%;
      background: #000;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ── FULL CAMERA VIEW ── */
    #world-preview {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      transform: scaleX(-1); /* Mirror for natural feel */
    }

    /* ── VIGNETTE + SCAN LINES ── */
    .overlay-effects {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
    }
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
    }
    .cyan-tint {
      position: absolute;
      inset: 0;
      background: rgba(0,229,255,0.04);
      mix-blend-mode: screen;
    }

    /* ── TOP HUD ── */
    .hud-top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    }
    .hud-logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255,77,109,0.15);
      border: 1px solid rgba(255,77,109,0.4);
      border-radius: 50px;
      padding: 0.35rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--red);
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .live-indicator.show { opacity: 1; }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

    /* ── CENTER STATUS ── */
    .center-status {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      pointer-events: none;
    }
    .center-status.hidden { opacity: 0; }

    .status-spinner {
      width: 56px;
      height: 56px;
      border: 2px solid rgba(0,229,255,0.15);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text {
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(0,229,255,0.5);
    }

    /* ── BOTTOM HUD ── */
    .hud-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 1.5rem;
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .stats-row {
      display: flex;
      gap: 1.5rem;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .stats-row.show { opacity: 1; }
    .stat {
      text-align: center;
    }
    .stat-val {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      color: var(--cyan);
    }
    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.15rem;
    }

    .room-pill {
      background: rgba(10,13,20,0.85);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.5rem 1.25rem;
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      color: var(--text-muted);
    }
    .room-pill span { color: var(--cyan); }

    .btn-end {
      padding: 0.75rem 2rem;
      border-radius: 50px;
      background: rgba(255,77,109,0.15);
      border: 1px solid rgba(255,77,109,0.4);
      color: var(--red);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }
    .btn-end:hover { background: rgba(255,77,109,0.25); box-shadow: 0 0 20px rgba(255,77,109,0.2); }

    /* ── FRAME CORNERS ── */
    .corner {
      position: fixed;
      width: 40px;
      height: 40px;
      z-index: 8;
      border-color: var(--cyan);
      border-style: solid;
      opacity: 0.5;
    }
    .corner-tl { top: 1rem; left: 1rem; border-width: 2px 0 0 2px; }
    .corner-tr { top: 1rem; right: 1rem; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 1rem; left: 1rem; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 1rem; right: 1rem; border-width: 0 2px 2px 0; }

    /* ── ERROR SCREEN ── */
    .error-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
      padding: 2rem;
    }
    .error-screen.show { display: flex; }
    .error-icon { font-size: 3rem; }
    .error-title { font-family: 'Orbitron', monospace; font-size: 1rem; color: var(--red); letter-spacing: 0.12em; }
    .error-msg { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; max-width: 340px; }
    .btn-back {
      margin-top: 0.5rem;
      padding: 0.7rem 1.75rem;
      border-radius: 50px;
      background: var(--cyan);
      color: #040508;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #33eeff; }
  </style>
</head>
<body>

<!-- CAMERA PREVIEW -->
<video id="world-preview" autoplay muted playsinline></video>

<!-- OVERLAY EFFECTS -->
<div class="overlay-effects">
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="cyan-tint"></div>
</div>

<!-- FRAME CORNERS -->
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<!-- TOP HUD -->
<div class="hud-top">
  <div class="hud-logo">ARC</div>
  <div class="live-indicator" id="live-indicator">
    <div class="live-dot"></div>
    LIVE WORLD
  </div>
</div>

<!-- CENTER STATUS (loading) -->
<div class="center-status" id="center-status">
  <div class="status-spinner"></div>
  <div class="status-text" id="status-text">INITIALIZING WORLD STREAM</div>
</div>

<!-- BOTTOM HUD -->
<div class="hud-bottom">
  <div class="stats-row" id="stats-row">
    <div class="stat">
      <div class="stat-val" id="stat-viewers">0</div>
      <div class="stat-label">Viewers</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-quality">HD</div>
      <div class="stat-label">Quality</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-time">0:00</div>
      <div class="stat-label">Live for</div>
    </div>
  </div>
  <div class="room-pill">Broadcasting to <span id="room-display">---</span></div>
  <button class="btn-end" onclick="endBroadcast()">✕ End World Broadcast</button>
</div>

<!-- ERROR SCREEN -->
<div class="error-screen" id="error-screen">
  <div class="error-icon">⚠️</div>
  <div class="error-title" id="error-title">Connection Error</div>
  <div class="error-msg" id="error-msg">Something went wrong.</div>
  <button class="btn-back" onclick="location.href='/'">← Back to ARC</button>
</div>

<script>
const params = new URLSearchParams(location.search);
const roomId = params.get('room')?.toUpperCase();

if (!roomId) location.href = '/';
document.getElementById('room-display').textContent = roomId;

const STUN_SERVERS = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]
};

let localStream = null;
let peers = {};
let peerInfo = {};
let socket;
let viewerCount = 0;
let startTime = null;
let timerInterval = null;

function setStatus(text) {
  document.getElementById('status-text').textContent = text;
}

function showError(title, msg) {
  document.getElementById('error-title').textContent = title;
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-screen').classList.add('show');
}

function goLive() {
  document.getElementById('center-status').classList.add('hidden');
  document.getElementById('live-indicator').classList.add('show');
  document.getElementById('stats-row').classList.add('show');
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
  const secs = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  document.getElementById('stat-time').textContent = `${m}:${String(s).padStart(2,'0')}`;
}

function updateViewers(n) {
  viewerCount = n;
  document.getElementById('stat-viewers').textContent = n;
}

// ── GET CAMERA ──
async function initCamera() {
  setStatus('REQUESTING CAMERA ACCESS');
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' },
      audio: false
    });
  } catch {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    } catch (err) {
      showError('Camera Required', 'Please allow camera access to share a world. ' + err.message);
      return;
    }
  }

  const preview = document.getElementById('world-preview');
  preview.srcObject = localStream;

  // Detect quality
  const videoTrack = localStream.getVideoTracks()[0];
  if (videoTrack) {
    const settings = videoTrack.getSettings();
    const q = (settings.width || 0) >= 1280 ? 'HD' : (settings.width || 0) >= 640 ? 'SD' : 'LQ';
    document.getElementById('stat-quality').textContent = q;
  }

  connectSocket();
}

// ── WEBRTC: send stream to a peer ──
function createPeerForGuest(peerId) {
  if (peers[peerId]) return;

  const pc = new RTCPeerConnection(STUN_SERVERS);
  peers[peerId] = pc;

  // Add all local tracks
  if (localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      socket.emit('signal', {
        to: peerId,
        signal: { type: 'candidate', candidate: e.candidate }
      });
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      updateViewers(Object.keys(peers).length);
    }
    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected' || pc.connectionState === 'closed') {
      pc.close();
      delete peers[peerId];
      updateViewers(Object.keys(peers).length);
    }
  };

  pc.createOffer()
    .then(offer => pc.setLocalDescription(offer))
    .then(() => {
      socket.emit('signal', {
        to: peerId,
        signal: { type: 'offer', sdp: pc.localDescription }
      });
    });
}

async function handleSignal(from, signal) {
  if (!peers[from]) createPeerForGuest(from);
  const pc = peers[from];

  if (signal.type === 'answer') {
    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
    updateViewers(Object.keys(peers).length);
  } else if (signal.type === 'candidate') {
    try { await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)); } catch {}
  }
}

// ── SOCKET ──
function connectSocket() {
  setStatus('CONNECTING TO ROOM');
  socket = io();

  socket.on('connect', () => {
    setStatus('JOINING AS WORLD');
    socket.emit('join-room', { roomId, name: 'World', role: 'world' });
  });

  socket.on('room-joined', ({ users }) => {
    setStatus('WORLD STREAM ACTIVE');
    goLive();

    // Connect to all existing guests
    users.forEach(u => {
      peerInfo[u.id] = u;
      createPeerForGuest(u.id);
    });
  });

  socket.on('user-joined', ({ userId, name, role }) => {
    if (role === 'guest') {
      peerInfo[userId] = { id: userId, name, role };
      createPeerForGuest(userId);
    }
  });

  socket.on('user-left', ({ userId }) => {
    peers[userId]?.close();
    delete peers[userId];
    delete peerInfo[userId];
    updateViewers(Object.keys(peers).length);
  });

  socket.on('signal', ({ from, signal }) => handleSignal(from, signal));

  socket.on('error', ({ message }) => {
    showError('Room Error', message);
  });

  socket.on('disconnect', () => {
    if (document.getElementById('error-screen').style.display !== 'flex') {
      showError('Disconnected', 'Lost connection to the server. Please try again.');
    }
  });
}

function endBroadcast() {
  clearInterval(timerInterval);
  localStream?.getTracks().forEach(t => t.stop());
  Object.values(peers).forEach(pc => pc.close());
  socket?.disconnect();
  location.href = '/';
}

// Start
initCamera();
</script>
</body>
</html>
